---
version: 2

build:
  os: ubuntu-lts-latest
  tools:
    # Mandatory field. We allow uv to install Python to avoid manual
    # duplication, but latest is usually the correct version.
    python: latest
  jobs:
    create_environment:
      # Need the tags to calculate the version (sometimes).
      - git fetch --tags

      - asdf plugin add uv
      - asdf install uv latest
      - asdf global uv latest

    build:
      html:
        - uvx --with tox-uv tox run -e docs-sponsors
        - uvx --with tox-uv tox run -e docs-build -- $READTHEDOCS_OUTPUT
